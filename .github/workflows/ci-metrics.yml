name: CI timing evidence
on:
  workflow_run:
    workflows: ['项目检查', 'Desktop package', '稳定批次版本 PR 与正式发布', '版本 PR 精确提交检查']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: '只读采集现有 GitHub Actions run，不创建版本或发布'
        required: true
        type: string
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  timings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 采集已结束运行的各次尝试与步骤耗时
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: python3 -B scripts/ci_metrics.py --run-id "$RUN_ID" --output .ci/ci-metrics.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-timing-${{ inputs.run_id || github.event.workflow_run.id }}
          path: .ci/ci-metrics.json
          if-no-files-found: error
          retention-days: 14
