name: 项目检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -v
      - run: node --check adaptive_rsi/web/app.js
      - run: node --check adaptive_rsi/web/i18n.js
      - run: node --check adaptive_rsi/web/model-center.js
      - run: python3 scripts/package.py
