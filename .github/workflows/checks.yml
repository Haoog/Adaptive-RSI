name: 项目检查

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      verification_mode: ${{ steps.classify.outputs.verification_mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              base="$BASE_SHA"
            else
              git fetch --no-tags origin "$BASE_REF" --depth=1
              base="$(git rev-parse FETCH_HEAD)"
            fi
          elif [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            base="$BEFORE_SHA"
          else
            base="$(git rev-parse HEAD^)"
          fi
          git diff --name-only "$base" HEAD > /tmp/rsi-changed-paths
          metadata_candidate=true
          while IFS= read -r path; do
            case "$path" in
              plugin.json|pyproject.toml|adaptive_rsi/__init__.py|update.json|README.md|README.en.md|CHANGELOG.md|CHANGELOG.en.md|CONTRIBUTING.md|CONTRIBUTING.en.md|DESKTOP.md|DESKTOP.en.md|EXPERIENCE.md|EXPERIENCE.en.md|RELEASING.md|RELEASING.en.md|RELIABILITY.md|RELIABILITY.en.md|SERVER.md|SERVER.en.md|VALIDATION.md|VALIDATION.en.md|LIVE_VALIDATION.md|LIVE_VALIDATION.en.md|docs/*) ;;
              *) metadata_candidate=false; break ;;
            esac
          done < /tmp/rsi-changed-paths
          mode=full
          if [ "$metadata_candidate" = true ]; then
            mode="$(python3 scripts/classify_changes.py "$base" HEAD)"
          fi
          case "$mode" in docs|version|full) ;; *) exit 1 ;; esac
          echo "verification_mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = docs ]; then docs_only=true; else docs_only=false; fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Verification mode: $mode"
          cat /tmp/rsi-changed-paths

  docs:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/check_docs.py

  version_metadata:
    needs: changes
    if: needs.changes.outputs.verification_mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_docs.py
      - name: 说明正式发版验证边界
        run: echo "Only the independently reconstructed release metadata patch changed. Exact-head full tests, browser, desktop build and provenance remain mandatory in release-verify.yml before automatic release merge."

  python:
    needs: changes
    if: needs.changes.outputs.verification_mode == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python 3.9 兼容
            os: ubuntu-latest
            python: '3.9'
            modules: tests.test_comprehensive_audit tests.test_store tests.test_usage_report tests.test_updates_recovery tests.test_auth_sessions tests.test_server_hardening tests.test_audit_round6 tests.test_task_lifecycle tests.test_task_groups tests.test_update_admission tests.test_dependency_dag tests.test_experiment_report tests.test_native_path_races tests.test_store_observability tests.test_config_history
          - name: Python 3.14 兼容
            os: ubuntu-latest
            python: '3.14'
            modules: tests.test_comprehensive_audit tests.test_store tests.test_usage_report tests.test_updates_recovery tests.test_auth_sessions tests.test_server_hardening tests.test_audit_round6 tests.test_task_lifecycle tests.test_task_groups tests.test_update_admission tests.test_dependency_dag tests.test_experiment_report tests.test_native_path_races tests.test_store_observability tests.test_config_history
          - name: 控制、恢复与桌面
            os: ubuntu-latest
            modules: tests.test_controls tests.test_updates_recovery tests.test_update_safety tests.test_launcher_regressions tests.test_desktop_runtime tests.test_desktop_release
          - name: 运行时核心
            os: ubuntu-latest
            modules: tests.test_runtime.RuntimeTest
          - name: 运行时适配与服务
            os: ubuntu-latest
            modules: tests.test_runtime.ConfigurationAndAdapterTest tests.test_runtime.ServerTest
          - name: 隔离、调度与体验
            os: ubuntu-latest
            modules: tests.test_runtime_safety tests.test_scheduler_isolation tests.test_schedule_consistency tests.test_experience tests.test_workflow_experience
          - name: 交付循环
            os: ubuntu-latest
            modules: tests.test_delivery_loop
          - name: 发布与数据
            os: ubuntu-latest
            modules: tests.test_resource_priority tests.test_deployment_observation tests.test_release tests.test_release_parallel tests.test_validation_planning tests.test_release_endpoints tests.test_release_smoke tests.test_data_hardening tests.test_store tests.test_comprehensive_audit tests.test_audit_round3 tests.test_audit_round4 tests.test_audit_round5 tests.test_audit_round6 tests.test_task_lifecycle tests.test_task_groups tests.test_update_admission tests.test_dependency_dag tests.test_experiment_report tests.test_native_path_races tests.test_store_observability tests.test_config_history
          - name: 模型与可靠性
            os: ubuntu-latest
            modules: tests.test_model_center tests.test_reliability tests.test_recovery
          - name: 运营、发现与文档
            os: ubuntu-latest
            modules: tests.test_backend_hardening tests.test_catalog tests.test_docs tests.test_discovery_hardening tests.test_operability tests.test_usage_report

          - name: 服务器、协议与集成
            os: ubuntu-latest
            modules: tests.test_auth_sessions tests.test_protocols tests.test_server_execution tests.test_server_hardening tests.test_audit_boundaries tests.test_opencode_integration tests.test_codex_docker tests.test_credential_lock_scope
    name: Python · ${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python || '3.12' }}
      - run: python3 scripts/check_test_matrix.py
      - run: python3 -m unittest -v ${{ matrix.modules }}

  quick_python:
    needs: changes
    if: needs.changes.outputs.verification_mode == 'full'
    outputs:
      test_count: ${{ steps.summary.outputs.test_count }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_api_contract.py
      - run: python3 scripts/check_i18n.py
      - name: 快速测试与数量指标
        id: summary
        run: |
          python3 -m unittest tests.test_store tests.test_audit_round5 -q 2> /tmp/quick-tests.log
          count="$(sed -n 's/^Ran \\([0-9][0-9]*\\) tests.*/\\1/p' /tmp/quick-tests.log | tail -1)"
          echo "test_count=${count:-0}" >> "$GITHUB_OUTPUT"

  macos_sandbox_core:
    needs: changes
    if: needs.changes.outputs.verification_mode == 'full'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: macOS Seatbelt 与 Keychain
        run: |
          python3 -m unittest -v \
            tests.test_comprehensive_audit.AuditRegressionTest.test_command_cannot_write_outside_host_plan_scope \
            tests.test_controls.ValueAndIsolationTest.test_worker_and_native_command_cannot_read_other_project \
            tests.test_model_center.ModelCenterTest.test_real_keychain_round_trip_and_no_plaintext_database_key \
            tests.test_audit_boundaries.CodexExecutableTest.test_symlinked_codex_can_start_itself_inside_permissions \
            tests.test_runtime.RuntimeTest.test_green_tests_cannot_bypass_blocking_maintainability_review \
            tests.test_runtime.RuntimeTest.test_real_git_and_sandbox_end_to_end_without_user_tree_changes \
            tests.test_runtime.RuntimeTest.test_fake_agent_success_cannot_replace_original_tests \
            tests.test_runtime.RuntimeTest.test_dependency_seed_is_frozen_for_both_checks_and_preserves_original \
            tests.test_runtime.RuntimeTest.test_sandbox_hides_controller_prevents_network_and_harness_writes \
            tests.test_runtime.RuntimeTest.test_read_only_model_cannot_mutate_sealed_candidate \
            tests.test_runtime.RuntimeTest.test_paired_evolution_promotes_retrieves_and_rolls_back_verified_guidance

  macos_sandbox_flows:
    needs: changes
    if: needs.changes.outputs.verification_mode == 'full'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: macOS 隔离交付与可靠性
        run: |
          python3 scripts/test_selected.py --workers 4 --timeout 300 --durations .ci/macos-flow-durations.json \
            tests.test_delivery_loop.DeliveryLoopTest.test_candidate_cannot_weaken_a_modern_test_file_to_hide_a_regression \
            tests.test_delivery_loop.DeliveryLoopTest.test_high_risk_acceptance_artifacts_never_enter_implementer_workspace \
            tests.test_delivery_loop.DeliveryLoopTest.test_candidate_new_failing_test_is_not_erased_by_frozen_regression \
            tests.test_delivery_loop.DeliveryLoopTest.test_independent_acceptance_blocks_weak_original_and_candidate_tests \
            tests.test_delivery_loop.DeliveryLoopTest.test_auto_pr_is_queued_only_after_all_local_gates \
            tests.test_delivery_loop.DeliveryLoopTest.test_actual_codex_single_layer_permissions_hide_secrets_and_disable_network \
            tests.test_delivery_loop.DeliveryLoopTest.test_native_command_cannot_install_host_git_execution_hooks \
            tests.test_delivery_loop.DeliveryLoopTest.test_stale_candidate_before_pr_is_invalidated_and_can_be_replanned \
            tests.test_delivery_loop.DeliveryLoopTest.test_merged_feedback_rechecks_changed_mainline_and_reports_real_regression \
            tests.test_reliability.ReliabilityTest.test_review_outage_reuses_plan_and_patch_but_reruns_checks \
            tests.test_reliability.ReliabilityTest.test_implementation_route_change_reuses_plan_without_acceptance \
            tests.test_reliability.ReliabilityTest.test_configuration_change_uses_test_first_without_independent_acceptance \
            tests.test_reliability.ReliabilityTest.test_completed_review_is_reused_after_a_post_review_failure \
            tests.test_reliability.ReliabilityTest.test_changed_baseline_invalidates_recovery_cache \
            tests.test_reliability.ReliabilityTest.test_value_assessment_yields_and_reuses_plan_without_spending_retry \
            tests.test_reliability.ReliabilityTest.test_high_risk_requires_additional_review_and_preserves_blocking_result \
            tests.test_reliability.ReliabilityTest.test_ordinary_high_risk_does_not_force_a_second_review \
            tests.test_workflow_experience.ExperienceTest.test_review_rejection_reaches_next_implementation_without_sealed_source

  javascript:
    needs: changes
    if: needs.changes.outputs.verification_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node --check adaptive_rsi/web/app.js
      - run: node --check adaptive_rsi/web/i18n.js
      - run: node --check adaptive_rsi/web/model-center.js
      - run: node --check adaptive_rsi/web/auth.js
      - run: node --check adaptive_rsi/web/experience.js
      - run: node --check adaptive_rsi/web/native-update.js
      - run: node --check adaptive_rsi/web/batch.js
      - run: node --check adaptive_rsi/web/install.js
      - run: node --check adaptive_rsi/web/sw.js
      - run: python3 scripts/check_i18n.py
      - run: python3 scripts/check_api_contract.py
      - run: node --test tests/web_*.cjs

  browser:
    needs: changes
    if: needs.changes.outputs.verification_mode == 'full'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - name: 浏览器真实表单与多项目检查
        run: npm run test:browser

  package:
    needs: changes
    if: needs.changes.outputs.verification_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-build-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-build-${{ runner.os }}-
      - run: python3 scripts/package.py
      - run: python3 -m pip install --disable-pip-version-check -r requirements-build.txt
      - run: python3 -m build --wheel

  linux:
    needs: changes
    if: needs.changes.outputs.verification_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: 构建 Linux 执行镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.worker
          tags: adaptive-rsi-worker:local
          load: true
          cache-from: type=gha,scope=worker-${{ hashFiles('deploy/Dockerfile.worker') }}
          cache-to: type=gha,mode=max,scope=worker-${{ hashFiles('deploy/Dockerfile.worker') }}
      - name: 验证 Linux 隔离、完整候选检查和真实 CLI 协议
        env:
          RSI_DOCKER_TESTS: '1'
          RSI_OPENCODE_TESTS: '1'
          RSI_AUTH_DOCKER_TESTS: '1'
        run: python3 -m unittest -v tests.test_protocols tests.test_server_execution tests.test_opencode_integration tests.test_codex_docker tests.test_auth_sessions
      - name: 检查服务器安装脚本
        run: bash -n scripts/install-server.sh

  verify:
    if: always()
    needs: [changes, docs, version_metadata, quick_python, python, macos_sandbox_core, macos_sandbox_flows, javascript, browser, package, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总必需检查
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          VERIFICATION_MODE: ${{ needs.changes.outputs.verification_mode }}
          VERSION_RESULT: ${{ needs.version_metadata.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          QUICK_PYTHON_RESULT: ${{ needs.quick_python.result }}
          MACOS_SANDBOX_CORE_RESULT: ${{ needs.macos_sandbox_core.result }}
          MACOS_SANDBOX_FLOWS_RESULT: ${{ needs.macos_sandbox_flows.result }}
          JAVASCRIPT_RESULT: ${{ needs.javascript.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: |
          if [ "$CHANGES_RESULT" != success ]; then
            echo "Change classification failed"
            exit 1
          fi
          if [ "$VERIFICATION_MODE" = version ]; then
            if [ "$VERSION_RESULT" != success ]; then
              echo "Release metadata checks failed: $VERSION_RESULT"
              exit 1
            fi
            echo "Mechanical metadata checks passed; release-verify retains the full final gate"
            exit 0
          fi
          if [ "$DOCS_ONLY" = true ]; then
            if [ "$DOCS_RESULT" != success ]; then
              echo "Documentation checks failed: $DOCS_RESULT"
              exit 1
            fi
            echo "Documentation checks passed"
            exit 0
          fi
          for result in "$QUICK_PYTHON_RESULT" "$PYTHON_RESULT" "$MACOS_SANDBOX_CORE_RESULT" "$MACOS_SANDBOX_FLOWS_RESULT" "$JAVASCRIPT_RESULT" "$BROWSER_RESULT" "$PACKAGE_RESULT" "$LINUX_RESULT"; do
            if [ "$result" != success ]; then
              echo "One or more required jobs failed: $result"
              exit 1
            fi
          done
          echo "All required checks passed"

  ci_metrics:
    if: always() && needs.changes.outputs.verification_mode == 'full'
    needs: [changes, quick_python, python, macos_sandbox_core, macos_sandbox_flows, javascript, browser, package, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record bounded CI outcome and quick-test count
        run: |
          {
            echo "## CI metrics"
            echo "- exact SHA: \`$GITHUB_SHA\`"
            echo "- quick tests: ${{ needs.quick_python.outputs.test_count }}"
            echo "- python: ${{ needs.python.result }}"
            echo "- browser: ${{ needs.browser.result }}"
            echo "- desktop packaging: ${{ needs.package.result }}"
            echo "- linux isolation: ${{ needs.linux.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
