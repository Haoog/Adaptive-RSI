name: 项目检查
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 启动恢复与隔离预检
        run: >-
          python3 -m unittest -v
          tests.test_controls.UpdatesTest.test_supervised_upgrade_and_failed_start_restore_real_service_and_database
          tests.test_controls.ValueAndIsolationTest.test_worker_and_native_command_cannot_read_other_project
      - run: python3 -m unittest discover -v
      - run: node --check adaptive_rsi/web/app.js
      - run: node --check adaptive_rsi/web/i18n.js
      - run: node --check adaptive_rsi/web/model-center.js
      - run: node --test tests/web_requests.cjs
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - name: 浏览器真实表单与多项目检查
        run: npm run test:browser
      - run: python3 scripts/package.py
      - run: python3 -m pip install build
      - run: python3 -m build --wheel
