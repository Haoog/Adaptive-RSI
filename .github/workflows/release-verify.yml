name: 版本 PR 精确提交检查
run-name: 'Release verification PR #${{ inputs.pr }} @${{ inputs.sha }}'
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
        type: string
      sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-pr-${{ inputs.pr }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 独立重建版本补丁并核对 PR 身份
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          PR_SHA: ${{ inputs.sha }}
        run: python3 scripts/release.py gate --pr "$PR_NUMBER" --sha "$PR_SHA"
  tests:
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci/test-durations.json
          key: test-timings-${{ runner.os }}-${{ hashFiles('tests/test_*.py', 'scripts/test_worker.py') }}-${{ github.run_id }}
          restore-keys: test-timings-${{ runner.os }}-
      - run: python3 scripts/test_parallel.py --durations .ci/test-durations.json
      - run: node --check adaptive_rsi/web/app.js && node --check adaptive_rsi/web/i18n.js && node --check adaptive_rsi/web/model-center.js && node --check adaptive_rsi/web/auth.js && node --check adaptive_rsi/web/experience.js && node --check adaptive_rsi/web/install.js && node --check adaptive_rsi/web/sw.js
      - run: node --check adaptive_rsi/web/native-update.js && node --check adaptive_rsi/web/batch.js
      - run: npm ci --ignore-scripts
      - run: node scripts/check_i18n_ast.cjs
      - run: node --test tests/web_*.cjs
      - run: python3 scripts/check_i18n.py
      - run: python3 scripts/check_api_contract.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: timing-${{ github.run_id }}
          path: |
            .ci/test-durations.json
            .ci/test-durations.failures.json
          if-no-files-found: ignore
  browser:
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run test:browser
  verify:
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 记录精确源树
        id: source
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/pip
          key: pip-build-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-build-${{ runner.os }}-
      - run: python3 scripts/package.py
      - run: python3 -m pip install --disable-pip-version-check -r requirements-build.txt
      - run: python3 -m build --wheel
        env:
          SOURCE_DATE_EPOCH: '1577836800'
      - name: 安装 macOS ARM64 桌面构建工具
        run: |
          rustup default 1.99.1
          npm ci --prefix desktop
      - name: 构建、验证并收集桌面安装包
        env:
          RSI_UPDATER_PUBLIC_KEY: ${{ vars.RSI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$RSI_UPDATER_PUBLIC_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Desktop updater signing configuration is required for a formal release.' >&2
            exit 1
          fi
          npm run --prefix desktop build
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
          python3 scripts/test_updater_signing.py
          codesign --verify --deep --strict "desktop/src-tauri/target/release/bundle/macos/Adaptive RSI.app"
          "desktop/src-tauri/target/release/bundle/macos/Adaptive RSI.app/Contents/MacOS/adaptive-rsi-engine" --version
          python3 scripts/package_desktop.py
          test -s dist/desktop-latest.json
          VERSION=$(python3 -c 'from adaptive_rsi import __version__; print(__version__)')
          DMG="dist/adaptive-rsi-${VERSION}-macos-arm64-adhoc.dmg"
          (cd dist && shasum -a 256 -c "adaptive-rsi-${VERSION}-macos-arm64-adhoc.dmg.sha256")
          python3 scripts/package_desktop.py verify-dmg --image "$DMG"
      - name: 最终安装与升级 smoke
        env:
          GH_TOKEN: ${{ github.token }}
          RSI_SOURCE_SHA: ${{ needs.gate.outputs.sha }}
          RSI_SOURCE_TREE: ${{ steps.source.outputs.tree }}
          RSI_WORKFLOW_REF: ${{ github.workflow_ref }}
          RSI_WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/release_smoke.py
      - name: 为精确构建产物签发 GitHub provenance
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.attest.outcome == 'success'
        continue-on-error: true
        with:
          name: release-verified-${{ steps.source.outputs.tree }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  report:
    if: always() && needs.gate.result == 'success'
    needs: [gate, tests, browser, verify]
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: 为经过验证的 PR SHA 写入正常必需检查
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ needs.gate.outputs.sha }}
          CHECK_RESULT: ${{ needs.verify.result == 'success' && needs.tests.result == 'success' && needs.browser.result == 'success' && 'success' || 'failure' }}
        run: |
          conclusion=failure
          if [ "$CHECK_RESULT" = success ]; then conclusion=success; fi
          gh api "repos/$GITHUB_REPOSITORY/check-runs" --method POST \
            -f name=verify -f head_sha="$PR_SHA" -f status=completed -f conclusion="$conclusion" \
            -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f 'output[title]=版本 PR 独立检查' \
            -f 'output[summary]=可信主线工作流核对精确版本补丁、完整检查及 ZIP/wheel/桌面安装包；provenance 可用时传递精确源树产物供正式发布复验复用。'
  merge:
    needs: [gate, tests, browser, verify, report]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 重查身份并按正常分支保护合并
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          PR_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          python3 scripts/release.py gate --pr "$PR_NUMBER" --sha "$PR_SHA"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$PR_SHA"
