name: 稳定批次版本 PR 与正式发布
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prepare_release:
        description: '集中发布已稳定的一批改动（普通主线合并不涨版本）'
        type: boolean
        default: false
      release_level:
        description: '版本级别：普通稳定批次保持 patch；新阶段才选择 minor/major'
        type: choice
        options: [patch, minor, major]
        default: patch
      new_product_stage:
        description: '确认这是一个新产品阶段（仅 minor/major 时勾选）'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: adaptive-rsi-release-main
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      mode: ${{ steps.prepare.outputs.mode }}
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RELEASE: ${{ inputs.prepare_release }}
          RELEASE_LEVEL: ${{ inputs.release_level }}
          NEW_PRODUCT_STAGE: ${{ inputs.new_product_stage }}
        run: python3 scripts/release.py prepare
      - name: 显式触发版本 PR 的精确 SHA 检查
        if: steps.prepare.outputs.mode == 'verify'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.prepare.outputs.pr }}
          PR_SHA: ${{ steps.prepare.outputs.sha }}
        run: gh workflow run release-verify.yml --ref main -f pr="$PR_NUMBER" -f sha="$PR_SHA"
      - name: 阻断需要人工处理的版本 PR
        if: steps.prepare.outputs.mode == 'blocked'
        run: exit 1
  verify:
    if: needs.prepare.outputs.mode == 'publish'
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -v
      - run: node --check adaptive_rsi/web/app.js && node --check adaptive_rsi/web/i18n.js && node --check adaptive_rsi/web/model-center.js
      - run: node --check adaptive_rsi/web/auth.js
      - run: node --test tests/web_requests.cjs
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run test:browser
      - run: python3 scripts/package.py
      - run: python3 -m pip install build
      - run: python3 -m build --wheel
        env:
          SOURCE_DATE_EPOCH: '1577836800'
      - name: 真实 ZIP 与 wheel 安装升级检查
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_smoke.py
      - uses: astral-sh/setup-uv@v6
      - name: 安装 macOS ARM64 桌面构建工具
        run: |
          rustup default stable
          npm ci --prefix desktop
      - name: 构建、验证并收集桌面安装包
        run: |
          npm run --prefix desktop build
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
          codesign --verify --deep --strict "desktop/src-tauri/target/release/bundle/macos/Adaptive RSI.app"
          "desktop/src-tauri/target/release/bundle/macos/Adaptive RSI.app/Contents/MacOS/adaptive-rsi-engine" --version
          python3 scripts/package_desktop.py
          VERSION=$(python3 -c 'from adaptive_rsi import __version__; print(__version__)')
          hdiutil verify "dist/adaptive-rsi-${VERSION}-macos-arm64-adhoc.dmg"
          (cd dist && shasum -a 256 -c "adaptive-rsi-${VERSION}-macos-arm64-adhoc.dmg.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.prepare.outputs.sha }}
          path: dist/*
  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.prepare.outputs.sha }}
          path: dist
      - name: 发布精确已验证提交的不可变资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish
