name: 稳定批次版本 PR 与正式发布
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prepare_release:
        description: '集中发布已稳定的一批改动（普通主线合并不涨版本）'
        type: boolean
        default: false
      release_level:
        description: '版本级别：普通稳定批次保持 patch；新阶段才选择 minor/major'
        type: choice
        options: [patch, minor, major]
        default: patch
      new_product_stage:
        description: '确认这是一个新产品阶段（仅 minor/major 时勾选）'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: adaptive-rsi-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      mode: ${{ steps.prepare.outputs.mode }}
      sha: ${{ steps.prepare.outputs.sha }}
      artifact_run_id: ${{ steps.prepare.outputs.artifact_run_id }}
      artifact_name: ${{ steps.prepare.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RELEASE: ${{ inputs.prepare_release }}
          RELEASE_LEVEL: ${{ inputs.release_level }}
          NEW_PRODUCT_STAGE: ${{ inputs.new_product_stage }}
        run: python3 scripts/release.py prepare
      - name: 显式触发版本 PR 的精确 SHA 检查
        if: steps.prepare.outputs.mode == 'verify'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.prepare.outputs.pr }}
          PR_SHA: ${{ steps.prepare.outputs.sha }}
        run: gh workflow run release-verify.yml --ref main -f pr="$PR_NUMBER" -f sha="$PR_SHA"
      - name: 阻断需要人工处理的版本 PR
        if: steps.prepare.outputs.mode == 'blocked'
        run: exit 1
  reuse:
    if: needs.prepare.outputs.mode == 'publish' && needs.prepare.outputs.artifact_run_id != ''
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          run-id: ${{ needs.prepare.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: dist
      - name: 核对源树、版本与全部资产字节
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py validate-verified --sha "${{ needs.prepare.outputs.sha }}" --directory dist
      - name: 验证 GitHub provenance 与可信签名工作流
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in dist/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-verify.yml" \
              --source-ref refs/heads/main --source-digest "${{ steps.proof.outputs.workflow_source_sha }}" \
              --deny-self-hosted-runners
          done
      - name: 独立复验安装包与校验和
        run: |
          (cd dist && shasum -a 256 -c *.sha256)
          VERSION=$(python3 -c 'from adaptive_rsi import __version__; print(__version__)')
          python3 scripts/package_desktop.py verify-dmg --image "dist/adaptive-rsi-${VERSION}-macos-arm64-adhoc.dmg"
      - name: 正式发布前独立 ZIP 与 wheel smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.prepare.outputs.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  build:
    needs: [prepare, reuse]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.mode == 'publish' && (needs.prepare.outputs.artifact_run_id == '' || needs.reuse.result != 'success')
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 记录精确源树
        id: source
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/pip
          key: pip-build-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-build-${{ runner.os }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci/test-durations.json
          key: test-timings-${{ runner.os }}-${{ hashFiles('tests/test_*.py', 'scripts/test_worker.py') }}-${{ github.run_id }}
          restore-keys: test-timings-${{ runner.os }}-
      - run: python3 scripts/test_parallel.py --durations .ci/test-durations.json
      - run: node --check adaptive_rsi/web/app.js && node --check adaptive_rsi/web/i18n.js && node --check adaptive_rsi/web/model-center.js
      - run: node --check adaptive_rsi/web/auth.js
      - run: node --check adaptive_rsi/web/native-update.js && node --check adaptive_rsi/web/batch.js
      - run: node --test tests/web_requests.cjs
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run test:browser
      - run: python3 scripts/package.py
      - run: python3 -m pip install --disable-pip-version-check -r requirements-build.txt
      - run: python3 -m build --wheel
        env:
          SOURCE_DATE_EPOCH: '1577836800'
      - name: 安装 macOS ARM64 桌面构建工具
        run: |
          rustup default 1.99.1
          npm ci --prefix desktop
      - name: 构建、验证并收集桌面安装包
        env:
          RSI_UPDATER_PUBLIC_KEY: ${{ vars.RSI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$RSI_UPDATER_PUBLIC_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Desktop updater signing configuration is required for a formal release.' >&2
            exit 1
          fi
          npm run --prefix desktop build
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
          python3 scripts/test_updater_signing.py
          codesign --verify --deep --strict "desktop/src-tauri/target/release/bundle/macos/Adaptive RSI.app"
          "desktop/src-tauri/target/release/bundle/macos/Adaptive RSI.app/Contents/MacOS/adaptive-rsi-engine" --version
          python3 scripts/package_desktop.py
          test -s dist/desktop-latest.json
          VERSION=$(python3 -c 'from adaptive_rsi import __version__; print(__version__)')
          DMG="dist/adaptive-rsi-${VERSION}-macos-arm64-adhoc.dmg"
          (cd dist && shasum -a 256 -c "adaptive-rsi-${VERSION}-macos-arm64-adhoc.dmg.sha256")
          python3 scripts/package_desktop.py verify-dmg --image "$DMG"
      - name: 完整安装与升级 smoke
        env:
          GH_TOKEN: ${{ github.token }}
          RSI_SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          RSI_SOURCE_TREE: ${{ steps.source.outputs.tree }}
          RSI_WORKFLOW_REF: ${{ github.workflow_ref }}
          RSI_WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/release_smoke.py
      - name: 为回退重建的精确产物签发 provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.prepare.outputs.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  publish:
    needs: [prepare, reuse, build]
    if: always() && needs.prepare.result == 'success' && (needs.reuse.result == 'success' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.prepare.outputs.sha }}
          path: dist
      - name: 发布精确已验证提交的不可变资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish
