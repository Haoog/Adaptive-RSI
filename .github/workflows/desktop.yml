name: Desktop package
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/package_desktop.py'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-verify.yml'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  desktop-macos:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: 安装桌面构建工具
        run: |
          rustup default stable
          npm ci --prefix desktop
      - name: 构建应用和安装包
        run: npm run --prefix desktop build
      - name: 验证桥接边界与独立引擎
        run: |
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
          codesign --verify --deep --strict "desktop/src-tauri/target/release/bundle/macos/Adaptive RSI.app"
          "desktop/src-tauri/target/release/bundle/macos/Adaptive RSI.app/Contents/MacOS/adaptive-rsi-engine" --version
          python3 scripts/package_desktop.py
          VERSION=$(python3 -c 'from adaptive_rsi import __version__; print(__version__)')
          hdiutil verify "dist/adaptive-rsi-${VERSION}-macos-arm64-adhoc.dmg"
          (cd dist && shasum -a 256 -c "adaptive-rsi-${VERSION}-macos-arm64-adhoc.dmg.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-rsi-macos-${{ runner.arch }}-adhoc
          path: dist/adaptive-rsi-*-macos-arm64-adhoc.dmg*
          if-no-files-found: error
