name: Desktop package
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'adaptive_rsi/**'
      - 'pyproject.toml'
      - 'rust-toolchain.toml'
      - 'requirements-build.txt'
      - 'scripts/package.py'
      - 'scripts/package_desktop.py'
      - 'scripts/sbom.py'
      - 'scripts/upgrade_harness.py'
      - 'scripts/test_updater_signing.py'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-verify.yml'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          mode=full
          if [ "$EVENT_NAME" = pull_request ]; then
            if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              base="$BASE_SHA"
            else
              git fetch --no-tags origin "$BASE_REF" --depth=1
              base="$(git rev-parse FETCH_HEAD)"
            fi
            git fetch --no-tags origin "$HEAD_SHA"
            git diff --name-only "$base" "$HEAD_SHA" > /tmp/rsi-desktop-paths
            # Execute only base helpers; PR changes to classification cannot grant a skip.
            metadata="$(python3 -m scripts.classify_changes "$base" "$HEAD_SHA")"
            if [ "$metadata" = version ]; then
              mode="$(python3 -c 'import sys; from scripts.release import desktop_mode; print(desktop_mode(*sys.argv[1:]))' "$base" "$HEAD_SHA" "$HEAD_REF" "$EVENT_NAME")"
            elif [[ "$HEAD_REF" == chore/release-v* ]]; then
              mode=full
            else
              mode="$(python3 scripts/package_desktop.py classify --event "$EVENT_NAME" < /tmp/rsi-desktop-paths)"
            fi
          else
            : > /tmp/rsi-desktop-paths
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Desktop build mode: $mode"
          cat /tmp/rsi-desktop-paths
  desktop-macos:
    needs: changes
    if: needs.changes.outputs.mode != 'skip'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.changes.outputs.mode == 'full'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.changes.outputs.mode == 'full'
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: 安装构建工具
        env:
          MODE: ${{ needs.changes.outputs.mode }}
        run: |
          rustup default 1.99.1
          if [ "$MODE" = full ]; then
            npm ci --prefix desktop
          fi
      - name: 构建并启动 bundled engine
        if: needs.changes.outputs.mode == 'smoke'
        run: |
          python3 desktop/scripts/engine.py
          python3 scripts/package_desktop.py smoke-engine desktop/src-tauri/binaries/adaptive-rsi-engine-*
      - name: 测试桌面构建配置
        if: needs.changes.outputs.mode == 'full'
        run: npm --prefix desktop test
      - name: 构建应用并运行 Rust 测试
        if: needs.changes.outputs.mode == 'full'
        run: |
          npm run --prefix desktop build
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: 验证旧版 DMG 的 HTTPS 续传、真卷挂载和原生响应策略
        if: needs.changes.outputs.mode == 'full'
        timeout-minutes: 5
        run: bash desktop/scripts/test_legacy_dmg_https.sh
      - name: 验证更新取消在服务恢复后删除持久租约
        if: needs.changes.outputs.mode == 'full'
        timeout-minutes: 5
        run: >-
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --bin adaptive-rsi-desktop
          native_update::lease_tests::update_cancel_removes_persisted_lease_after_service_recovery -- --ignored --exact --nocapture
      - name: 验证 FAT32 和 ExFAT 真卷备份
        if: needs.changes.outputs.mode == 'full'
        timeout-minutes: 5
        shell: bash
        run: |
          scratch=$(mktemp -d "$RUNNER_TEMP/rsi-backup-volumes.XXXXXX")
          disk=
          detach_volume() {
            if [[ -n "$disk" ]]; then
              hdiutil detach "$disk" || hdiutil detach -force "$disk" || return 1
              disk=
            fi
          }
          cleanup() {
            local status=$?
            if detach_volume; then
              rm -rf -- "$scratch" || status=1
            else
              echo "::error::Could not detach the backup test image on $disk"
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          fixture="$scratch/backup.sqlite3"
          sqlite3 -batch -bail "$fixture" <<'SQL'
          CREATE TABLE backup_fixture (id INTEGER PRIMARY KEY, value TEXT NOT NULL);
          INSERT INTO backup_fixture VALUES (1, 'synthetic backup data');
          SQL
          test "$(sqlite3 -batch -bail "$fixture" 'PRAGMA integrity_check;')" = ok

          test_name=tests::backup_saves_on_real_volume_without_hard_links
          result=0
          for filesystem in FAT32 ExFAT; do
            echo "Testing backup on $filesystem"
            image="$scratch/$filesystem.img"
            mkfile -n 512m "$image"
            disk=$(hdiutil attach -nomount -imagekey diskimage-class=CRawDiskImage "$image" |
              awk '$1 ~ /^\/dev\/disk[0-9]+$/ {print $1}')
            [[ "$disk" =~ ^/dev/disk[0-9]+$ ]]
            # Explicitly format the raw image. eraseDisk also mounts the new partition.
            diskutil eraseDisk "$filesystem" "RSI$filesystem" MBRFormat "$disk"
            diskutil info -plist "${disk}s1" > "$scratch/volume.plist"
            actual=$(plutil -extract FilesystemName raw "$scratch/volume.plist")
            expected=$filesystem
            if [[ "$filesystem" == FAT32 ]]; then
              expected='MS-DOS FAT32'
            fi
            test "$actual" = "$expected"
            mount_point=$(plutil -extract MountPoint raw "$scratch/volume.plist")
            test -d "$mount_point" && test -w "$mount_point" || exit 1

            if ! RSI_TEST_NO_HARDLINK_DIR="$mount_point" RSI_TEST_BACKUP_FIXTURE="$fixture" \
              cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml \
                --bin adaptive-rsi-desktop -- "$test_name" --ignored --exact --format pretty |
                tee "$scratch/test.log" ||
              ! grep -Fx "test $test_name ... ok" "$scratch/test.log"; then
              echo "::error::Real-volume backup test did not pass on $filesystem"
              result=1
            fi
            detach_volume
          done
          exit "$result"
      - name: 验证应用并生成完整安装包
        if: needs.changes.outputs.mode == 'full'
        run: |
          python3 scripts/test_updater_signing.py --measure-verification-rss
          python3 -B scripts/upgrade_harness.py --stage receipt authorization isolation --app "desktop/src-tauri/target/release/bundle/macos/Adaptive RSI.app"
          codesign --verify --deep --strict "desktop/src-tauri/target/release/bundle/macos/Adaptive RSI.app"
          "desktop/src-tauri/target/release/bundle/macos/Adaptive RSI.app/Contents/MacOS/adaptive-rsi-engine" --version
          python3 scripts/package_desktop.py
          VERSION=$(python3 -c 'from adaptive_rsi import __version__; print(__version__)')
          DMG="dist/adaptive-rsi-${VERSION}-macos-arm64-adhoc.dmg"
          (cd dist && shasum -a 256 -c "adaptive-rsi-${VERSION}-macos-arm64-adhoc.dmg.sha256")
          python3 scripts/package_desktop.py verify-dmg --image "$DMG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.changes.outputs.mode == 'full'
        with:
          name: adaptive-rsi-macos-${{ runner.arch }}-adhoc
          path: dist/adaptive-rsi-*-macos-arm64-adhoc.dmg*
          if-no-files-found: error
