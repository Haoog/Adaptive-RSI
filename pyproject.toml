[build-system]
requires = ["setuptools==80.9.0; python_version < '3.10'", "setuptools==84.2.1; python_version >= '3.10'", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-rsi"
version = "0.5.134"
description = "Local, evidence-gated autonomous improvement for Codex projects"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
adaptive-rsi = "adaptive_rsi.cli:main"

[tool.setuptools.packages.find]
include = ["adaptive_rsi*"]

[tool.setuptools.package-data]
adaptive_rsi = ["web/*", "schemas/*.json", "migrations/*.sql"]
