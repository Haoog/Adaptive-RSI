[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-rsi"
version = "0.2.0"
description = "Local, evidence-gated autonomous improvement for Codex projects"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
adaptive-rsi = "adaptive_rsi.cli:main"

[tool.setuptools.packages.find]
include = ["adaptive_rsi*"]

[tool.setuptools.package-data]
adaptive_rsi = ["web/*"]
